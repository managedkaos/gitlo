apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitbucket
  namespace: gitbucket
  labels:
    app.kubernetes.io/name: gitbucket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitbucket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitbucket
    spec:
      containers:
        - name: gitbucket
          image: gitbucket/gitbucket:4.48.0
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 29418
