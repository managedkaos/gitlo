apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitbucket
  namespace: gitbucket
  labels:
    app.kubernetes.io/name: gitbucket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitbucket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitbucket
    spec:
      initContainers:
        - name: download-gitbucket
          image: public.ecr.aws/docker/library/amazoncorretto:21
          command:
            - sh
            - -c
            - |
              curl -L -o /gitbucket/gitbucket.war \
                https://github.com/gitbucket/gitbucket/releases/download/4.48.0/gitbucket.war
          volumeMounts:
            - name: gitbucket-war
              mountPath: /gitbucket
      containers:
        - name: gitbucket
          image: public.ecr.aws/docker/library/amazoncorretto:21
          command:
            - java
            - -jar
            - /gitbucket/gitbucket.war
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 29418
          volumeMounts:
            - name: gitbucket-war
              mountPath: /gitbucket
      volumes:
        - name: gitbucket-war
          emptyDir: {}
