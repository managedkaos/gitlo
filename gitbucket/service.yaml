apiVersion: v1
kind: Service
metadata:
  name: gitbucket
  namespace: gitbucket
  labels:
    app.kubernetes.io/name: gitbucket
spec:
  selector:
    app.kubernetes.io/name: gitbucket
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: ssh
      port: 29418
      targetPort: ssh
