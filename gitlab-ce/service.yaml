apiVersion: v1
kind: Service
metadata:
  name: gitlab-ce
  namespace: gitlab-ce
  labels:
    app.kubernetes.io/name: gitlab-ce
spec:
  selector:
    app.kubernetes.io/name: gitlab-ce
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: ssh
      port: 22
      targetPort: ssh
