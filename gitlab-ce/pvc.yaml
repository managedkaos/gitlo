apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-ce-config
  namespace: gitlab-ce
  labels:
    app.kubernetes.io/name: gitlab-ce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-ce-data
  namespace: gitlab-ce
  labels:
    app.kubernetes.io/name: gitlab-ce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
