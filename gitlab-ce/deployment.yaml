apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-ce
  namespace: gitlab-ce
  labels:
    app.kubernetes.io/name: gitlab-ce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-ce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-ce
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: gitlab-ce
          image: gitlab/gitlab-ce:17.5.2-ce.0
          env:
            - name: GITLAB_URL
              value: "http://gitlab-ce.gitlab-ce.svc.cluster.local"
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlo-bootstrap
                  key: root-password
                  optional: true
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url ENV.fetch('GITLAB_URL')
                if ENV['GITLAB_ROOT_PASSWORD']
                  gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
                end
          ports:
            - name: http
              containerPort: 80
            - name: ssh
              containerPort: 22
          volumeMounts:
            - name: gitlab-ce-config
              mountPath: /etc/gitlab
            - name: gitlab-ce-data
              mountPath: /var/opt/gitlab
            - name: gitlab-ce-logs
              mountPath: /var/log/gitlab
            - name: gitlab-ce-shm
              mountPath: /dev/shm
      volumes:
        - name: gitlab-ce-config
          persistentVolumeClaim:
            claimName: gitlab-ce-config
        - name: gitlab-ce-data
          persistentVolumeClaim:
            claimName: gitlab-ce-data
        - name: gitlab-ce-logs
          emptyDir: {}
        - name: gitlab-ce-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
